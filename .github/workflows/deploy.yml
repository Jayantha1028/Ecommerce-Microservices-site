name: E-Commerce Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    name: Run Microservices Tests & Health Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary redis pytest httpx pydantic

      - name: Setup Environment Variables (.env)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=ci-testing-jwt-secret-key-at-least-32-chars-long|" .env
          for db in AUTH PRODUCT ORDER PAYMENT CART; do
            sed -i "s|^${db}_DB_PASSWORD=.*|${db}_DB_PASSWORD=ciTestDbPass123|" .env
          done
          echo "✔ Initialized .env for CI environment"

      - name: Start Microservices with Docker Compose
        run: |
          chmod +x run.sh stop.sh scripts/*.sh
          bash run.sh

      - name: Execute Full Integration Test Suite
        run: |
          bash scripts/test_all.sh

      - name: Shut Down Containers
        if: always()
        run: |
          docker compose down -v

  build-and-push-images:
    name: Build & Publish Container Images to GitHub Container Registry (GHCR)
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            dir: services/api-gateway
          - name: user-auth-service
            dir: services/auth-service
          - name: product-service
            dir: services/product-service
          - name: order-service
            dir: services/order-service
          - name: payment-service
            dir: services/payment-service
          - name: cart-service
            dir: services/cart-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Downcase GitHub Repository Owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ./${{ matrix.service.dir }}
          file: ./${{ matrix.service.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
