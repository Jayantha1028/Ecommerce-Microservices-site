---
# Perimeter Protection Policy: Only API Gateway is reachable from Ingress / Public internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress-boundary
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
{{- end }}
