{{- if .Values.networkPolicies.enabled }}
# Zero-Trust Database Network Isolation Policy
# Enforces that each PostgreSQL database instance only accepts traffic from its specific authorized microservice.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-product-db
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: product-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: product-service
      ports:
        - protocol: TCP
          port: 5432
---
